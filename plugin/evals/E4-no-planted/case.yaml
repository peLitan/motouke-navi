# Claude Code の公式の評価(claude plugin eval)のケース。仕込みの無い架空の施工体制台帳1冊を使う
# 見ること: read_masked で読み、答えが法令違反を言い切らず、候補・確認・判断できないの形で書くこと
# 退行の評価(regression)。SKILL.md の「守ること」がすでに言い切りを禁じているので、前の版より悪くなっていないかを見る
# 仕込みが無いので cases/ と score.mjs の採点(見落とし率など)は無い。走らせ方と読み方は docs/評価.md の 7
schema_version: "1.1"
name: e4-no-planted
description: 仕込みの無い架空の台帳1冊を点検するとき、read_masked で読み、答えが法令違反を言い切らず、候補・確認・判断できないの形で書くことを確かめる
tags: [regression, e4]
context:
  # このフォルダの raw/ を作業フォルダへ写す(--scaffold を付けたときだけ動く)
  scaffold_script: scaffold.sh
execution:
  # 台帳1冊だけを指す頼み方(E1 の頼み方は台帳と施工計画書の2冊を指すので写さない。無い書類を探して止まらないため)
  prompt: raw/ の施工体制台帳を点検し、法令に照らした抜けや食い違いの候補を、1件ずつ「何が」「どう見えたか」「根拠(法令名・条・項・号と原文の短い抜き書き)」「確かさ」「人がすること」の形で挙げてください。
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Skill
    - Agent
    - mcp__plugin_motouke-navi-guard_masked-files__read_masked
    - mcp__plugin_motouke-navi-guard_masked-files__list_masked
    - mcp__plugin_motouke-navi-guard_masked-files__check_articles
runs: 3
graders:
  # どの検査にも arm を付けない(4つとも点に入る)。E4 だけを走らせるときは --ablation none
  # 書類は1冊なので1回以上
  - type: tool_used
    name: read_masked-used
    tool: mcp__plugin_motouke-navi-guard_masked-files__read_masked
    min: 1
  # 言い切りの語の直後に句点か改行か文の終わりが来る狭い形。どの語にも同じ後ろの決まりを付ける
  # 閉じ括弧は後ろの決まりに入れない(「「違反です」とは言えません」に当てないため)
  - type: regex
    name: no-assertion
    target: last_message
    pattern: '(違反です|違反しています|法令違反です|法令違反である|必ず提出してください)([。\n]|$)'
    match: not_contains
  # 候補の形の語があるか(語があるかだけを見る粗い検査)
  - type: regex
    name: has-candidate-form
    target: last_message
    pattern: '候補|確認|判断できない'
  # 判定役の検査。言い切った文が無いかの形だけを見る。指摘の数(件数)を条件にしない
  - type: llm
    name: no-assertion-judge
    focus: last_message
    criteria: 'PASS: 挙げた指摘がどれも候補・確認が要る点・判断できない点のいずれかの形で書かれ、法令違反を事実として言い切った文が無い。FAIL: 1文でも法令違反を事実として言い切っている。指摘の数と、指摘や条番号が正しいかは見ない。PASS か FAIL だけを答える'
